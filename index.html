<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MH Battle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101d18;color:white;font-family:Arial;touch-action:none}
canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:3}.b{background:#07172ddd;border:1px solid #398bd0;border-radius:10px;padding:7px 12px;text-align:center}.b small{display:block;color:#9cc0d9;font-size:10px}
#joy{position:fixed;left:20px;bottom:25px;width:125px;height:125px;border:2px solid #74a8c9aa;background:#17334f99;border-radius:50%;z-index:4}.knob{width:52px;height:52px;background:#40a9e8dd;border-radius:50%;position:absolute;left:35px;top:35px}
#fire,#reload{position:fixed;z-index:4;border-radius:50%;font-weight:bold;color:white}.fire{right:22px;bottom:30px;width:105px;height:105px;background:#d53f4ddd;border:2px solid #ffd05a;font-size:18px}.reload{right:145px;bottom:45px;width:70px;height:70px;background:#173956dd;border:2px solid #83b8d8}
.screen{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#020913dd}.panel{width:90%;max-width:430px;text-align:center;background:#071a31f5;border:1px solid #3294dc;border-radius:24px;padding:28px}.logo{font-size:55px;font-weight:900;color:#51d8ff}h1{margin:0 0 10px}.panel button{padding:15px 28px;border:0;border-radius:14px;background:#1595e8;color:white;font-size:18px;font-weight:bold}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="b"><small>HP</small><b id="hp">100</b></div><div class="b"><small>KILLS</small><b id="kills">0</b></div><div class="b"><small>AMMO</small><b id="ammo">30</b></div></div>
<div id="joy"><div class="knob" id="knob"></div></div><button id="reload" class="reload">RELOAD</button><button id="fire" class="fire">FIRE</button>
<div id="start" class="screen"><div class="panel"><div class="logo">MH</div><h1>MH BATTLE</h1><p>Move, aim, shoot enemy bots, reload and survive.</p><button onclick="start()">START BATTLE</button></div></div>
<div id="over" class="screen" style="display:none"><div class="panel"><div class="logo">MH</div><h1>BATTLE OVER</h1><p>Kills: <b id="final">0</b></p><button onclick="start()">PLAY AGAIN</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,run=false,last,p,en=[],bs=[],eb=[],kills=0,ammo=30,jx=0,jy=0,shoot=0;
function sz(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);sz();
function add(){let a=Math.random()*6.28,r=Math.max(W,H)*.45;en.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,h:40,s:55,cd:1+Math.random()*2})}
function start(){document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';p={x:W/2,y:H/2,h:100,a:0};en=[];bs=[];eb=[];kills=0;ammo=30;for(let i=0;i<8;i++)add();run=true;last=performance.now();requestAnimationFrame(loop)}
function hud(){document.getElementById('hp').textContent=Math.max(0,Math.ceil(p.h));document.getElementById('kills').textContent=kills;document.getElementById('ammo').textContent=ammo}
function fire(){if(!run||ammo<=0)return;ammo--;let a=p.a;bs.push({x:p.x+Math.cos(a)*25,y:p.y+Math.sin(a)*25,vx:Math.cos(a)*650,vy:Math.sin(a)*650,l:1})}
function reload(){ammo=30;hud()}
document.getElementById('reload').onclick=reload;
document.getElementById('fire').onpointerdown=()=>{shoot=1;fire()};document.getElementById('fire').onpointerup=()=>shoot=0;
function loop(t){if(!run)return;let dt=Math.min((t-last)/1000,.04);last=t;x.fillStyle='#162c20';x.fillRect(0,0,W,H);
x.strokeStyle='#244c34';for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=48){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
p.x=Math.max(22,Math.min(W-22,p.x+jx*190*dt));p.y=Math.max(80,Math.min(H-22,p.y+jy*190*dt));if(shoot)fire();
for(let i=bs.length-1;i>=0;i--){let b=bs[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;let hit=false;for(let k=en.length-1;k>=0;k--){let e=en[k];if(Math.hypot(b.x-e.x,b.y-e.y)<22){e.h-=20;hit=true;if(e.h<=0){kills++;en.splice(k,1)}}}if(hit||b.l<=0)bs.splice(i,1)}
for(let e of en){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;if(d>100){e.x+=dx/d*e.s*dt;e.y+=dy/d*e.s*dt}e.cd-=dt;if(e.cd<=0&&d<500){e.cd=1.5;eb.push({x:e.x,y:e.y,vx:dx/d*260,vy:dy/d*260,l:2})}}
for(let i=eb.length-1;i>=0;i--){let b=eb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<18){p.h-=10;eb.splice(i,1)}else if(b.l<=0)eb.splice(i,1)}
for(let b of bs){x.fillStyle='#ffd35a';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}for(let b of eb){x.fillStyle='#ff5b5b';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()}
for(let e of en){x.fillStyle='#e24b58';x.beginPath();x.arc(e.x,e.y,17,0,7);x.fill()}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle='#29a7ff';x.beginPath();x.arc(0,0,17,0,7);x.fill();x.fillStyle='#222';x.fillRect(10,-4,28,8);x.restore();
hud();if(p.h<=0){run=false;document.getElementById('final').textContent=kills;document.getElementById('over').style.display='flex';return}if(en.length<5)add();requestAnimationFrame(loop)}
const joy=document.getElementById('joy'),kn=document.getElementById('knob');
function mv(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=43;if(d>m){dx=dx/d*m;dy=dy/d*m}jx=dx/m;jy=dy/m;kn.style.transform=`translate(${dx}px,${dy}px)`}
function stop(){jx=jy=0;kn.style.transform='translate(0,0)'}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);mv(e)};joy.onpointermove=e=>{if(e.buttons)mv(e)};joy.onpointerup=stop;joy.onpointercancel=stop;
c.onpointerdown=e=>{let r=c.getBoundingClientRect();p.a=Math.atan2(e.clientY-r.top-p.y,e.clientX-r.left-p.x)}
</script></body></html>
